name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: speech_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d speech_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: PostgreSQL integration tests
        run: npm run test:integration
        env:
          RUN_INFRA_TESTS: "1"
          CONFIRM_DATABASE_RESET: speech-platform-integration-tests
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/speech_platform_test
      - name: Unit and integration coverage
        run: npm run test:coverage
        env:
          RUN_INFRA_TESTS: "1"
          CONFIRM_DATABASE_RESET: speech-platform-integration-tests
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/speech_platform_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: speech-platform-api:ci
